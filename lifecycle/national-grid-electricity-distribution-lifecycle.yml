change_communication:
  changelog_url: null
  probes:
  - {path: /changelog, status: 404}
  - {path: /news, status: 404}
  mechanism: >-
    Per-dataset email subscription — a registered user subscribes to a dataset
    and is notified within 15 minutes of an update. This is the only change
    signal NGED offers, and it is per-dataset rather than per-API.
