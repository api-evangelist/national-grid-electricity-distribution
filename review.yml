      path: /api/openapi.json
      httpStatus: 404
    - host: connecteddata.nationalgrid.co.uk
      path: /api/3/openapi.json
      httpStatus: 404
    - host: connecteddata.nationalgrid.co.uk
      path: /robots.txt
      httpStatus: 200
      note: >-
        Disallows /api/ to crawlers and carries an extensive ai.robots.txt-derived
        AI bot blocklist. Crawl-Delay 10. The API is open to callers, closed to
        crawlers.
    - host: www.nationalgrid.co.uk
      path: /openapi.json
      httpStatus: 200
      note: >-
        FALSE POSITIVE. Zero-byte body, content-type text/plain. A soft 404 from
        the CDN. Same for /swagger.json, /api and /developers — all 200, all
        0 bytes. Recorded here so the 200 is never mistaken for a spec.
