      note: Planned outages. No API.
    - host: powerdiscoveryzone.nationalgrid.co.uk
      httpStatus: 200
      note: Education site. No API.
    - host: commercial.nationalgrid.co.uk
      httpStatus: 200
      note: Hosts the Network Opportunity Map and the Digitalisation & Data pages.
    - host: customer.nationalgrid.co.uk
      httpStatus: 200
      note: Regulatory information. No API.
  pathProbes:
    - host: connecteddata.nationalgrid.co.uk
      path: /api-guidance
      httpStatus: 200
    - host: connecteddata.nationalgrid.co.uk
      path: /api
      httpStatus: 200
