      path: /api/3
      httpStatus: 200
    - host: connecteddata.nationalgrid.co.uk
      path: /openapi.json
      httpStatus: 404
    - host: connecteddata.nationalgrid.co.uk
      path: /openapi.yaml
      httpStatus: 404
    - host: connecteddata.nationalgrid.co.uk
      path: /swagger.json
      httpStatus: 404
    - host: connecteddata.nationalgrid.co.uk
      path: /swagger
      httpStatus: 404
