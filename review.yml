undocumentedSurfaces:
  note: >-
    Recorded for completeness and deliberately NOT listed in apis.yml. These are
    internal AJAX endpoints extracted from the power-cuts portal's own JavaScript
    bundle. They are real and they answer anonymously, but NGED documents none of
    them, publishes no contract for them, and offers no terms for their use.
    Treating them as a public API would misrepresent the provider.
  source:
    url: https://powercuts.nationalgrid.co.uk/public/javascripts/angular.powercuts.js
    httpStatus: 200
    bytes: 60913
    fetched: '2026-07-27'
  endpoints:
    - /__powercuts/getAlerts
    - /__powercuts/getIncidentById
    - /__powercuts/getIncidentsAndAlertSummary
    - /__powercuts/getIncidentsByPostcode
    - /__powercuts/getRecentlySubmittedReportCount
    - /__powercuts/getTabularView
    - /__powercuts/getTotalsView
    - /__powercuts/getTwitterFeed
  liveCheck:
    - url: https://powercuts.nationalgrid.co.uk/__powercuts/getIncidentsAndAlertSummary
      httpStatus: 200
      contentType: application/json; charset=utf-8
      bytes: 1885
      anonymous: true
      fetched: '2026-07-27'
    - url: https://powercuts.nationalgrid.co.uk/public/geojson/map.geojson
      httpStatus: 200
      bytes: 93816
      anonymous: true
      fetched: '2026-07-27'
  documentedAlternative: >-
    The same information IS published properly — the "Live Power Cuts" dataset in
    the Connected Data catalogue (dataclassification Open, updatefrequency "Near
    Real Time", rights "WPD Open Data Licence", identifier PCD) carries
    power_outage_ext.csv and live_detailed_power_cuts.csv and downloads
    anonymously. A developer should use that, not the __powercuts endpoints.

sources:
  - url: https://connecteddata.nationalgrid.co.uk/
    type: Portal
    httpStatus: 200
    note: >-
      CKAN 2.9.8. meta description "National Grid Open Data Gateway". Declares
      four DCAT alternate representations in <head>. Theme assets are namespaced
      /webassets/wpd/ — the Western Power Distribution inheritance.
  - url: https://connecteddata.nationalgrid.co.uk/api-guidance
    type: Documentation
    httpStatus: 200
    note: The developer documentation. Base URL, endpoint table, token scheme, examples.
  - url: https://connecteddata.nationalgrid.co.uk/registration-and-subscription
    type: Documentation
    httpStatus: 200
    note: >-
      Confirms self-serve registration with email verification, per-dataset
      subscription notifications within 15 minutes of update, and
      nged.data@nationalgrid.co.uk as the contact for account deletion.
  - url: https://connecteddata.nationalgrid.co.uk/about
    type: About
    httpStatus: 200
    note: >-
      "We are the electricity distribution network operator for the Midlands,
      South West and Wales. We deliver electricity to over 7.9 million customers
      over a 55,500 square kilometres service area and we employ over 6,500
      staff." Also names the seven NGED legal entities and confirms Ofgem
      regulation.
  - url: https://www.nationalgrid.co.uk/open-data-licence
    type: License
    httpStatus: 200
    note: >-
      NGED Open Data Licence, December 2020, "based on the Open Government Licence
      v3.0". Worldwide, royalty-free, perpetual, non-exclusive, commercial reuse
      permitted, attribution "Supported by NGED Open Data" required, personal data
      excluded.
  - url: https://connecteddata.nationalgrid.co.uk/api/3/action/status_show
    type: API
    httpStatus: 200
    note: CKAN version and extension list. Anonymous.
  - url: https://connecteddata.nationalgrid.co.uk/api/3/action/package_search?rows=100
    type: API
    httpStatus: 200
    note: >-
      The load-bearing call. 91 datasets, 8,687 resources, the Open/Shared/Closed
      triage, and the redaction counts. Anonymous.
  - url: https://connecteddata.nationalgrid.co.uk/api/3/action/package_show?id=aggregated-smart-meter-data-lv-feeder
    type: API
    httpStatus: 200
    note: >-
      The mandate evidence. NGED quotes its own Ofgem licence condition in the
      dataset notes and ships the data alongside it.
  - url: https://connecteddata.nationalgrid.co.uk/catalog.jsonld
    type: JSONLD
    httpStatus: 200
    note: 205,251 bytes of DCAT JSON-LD. Anonymous.
  - url: https://connecteddata.nationalgrid.co.uk/dataset/distribution-substations
    type: Data
    httpStatus: 200
    note: >-
      A "Shared" dataset. The anonymous HTML page lists only the Data Sharing
      Assessment PDF resource — the CSV is neither linked nor URL-disclosed until
      you sign in. Confirms the gate is enforced in the UI as well as the API.
  - url: https://commercial.nationalgrid.co.uk/digitalisation-and-data
    type: Documentation
    httpStatus: 200
    note: NGED's digitalisation and data programme page, linked from the portal help.
  - url: https://api.github.com/orgs/nationalgrid
    type: Registry
    httpStatus: 200
    note: >-
      Returns an object with no login, name, blog, description or public_repos —
      no usable NGED GitHub organization. national-grid, nationalgriduk and
      NationalGridElectricityDistribution all returned 403 (not found / rate
      shaped). No NGED source-code presence was confirmed.
  - url: https://data.gov.uk/api/3/action/package_search?q=%22National+Grid+Electricity+Distribution%22
    type: Registry
    httpStatus: 200
    note: >-
      success:true, count 0. NGED publishes nothing to the UK national open data
      portal — its open data lives entirely on its own CKAN instance.

actions:
  apisListed: 2
  apisYmlCreated: true
  openapiHarvested: false
  specsCount: 0
  reason: >-
    Two real APIs are listed — the documented CKAN Action API and the DCAT
    catalogue export surface — because both are real, both are documented by NGED
    on its own pages, and both answered anonymously with 200 on 2026-07-27. No
    OpenAPI, AsyncAPI, GraphQL, Postman collection, JSON Schema or MCP descriptor
    exists to harvest, so openapi/ is omitted rather than filled with anything
    derived or invented. The eight /__powercuts/* endpoints observed in the
    power-cuts JavaScript bundle are recorded in this review but deliberately
    excluded from apis.yml because NGED documents none of them.
