- id: cdr-energy
  conforms: false
  evidence: Australian statute. No UK application; Britain has no consumer energy data right.
- id: ocpp-ocpi-openadr-ieee2030-5
  conforms: false
  evidence: >-
    No occurrence of OCPP, OCPI, OpenADR or IEEE 2030.5 anywhere in the catalogue
