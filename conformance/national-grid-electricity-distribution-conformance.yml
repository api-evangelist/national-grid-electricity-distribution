  evidence: /.well-known/openid-configuration returns 403 on every NGED host.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 403 (edge refusal) on every NGED host.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation headers observed; no deprecation policy published.
- id: openapi
  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /api/openapi.json and
