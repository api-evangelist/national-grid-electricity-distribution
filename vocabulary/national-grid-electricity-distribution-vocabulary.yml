method: derived
source: >-
  live anonymous /api/3/action/package_search?rows=100 over all 92 datasets and
  8,691 resources on 2026-07-27
note: >-
  The controlled vocabulary the NGED Connected Data Portal actually uses. NGED
  publishes no data dictionary, so every term and every enumerated value below
  was derived by enumerating the live catalogue — the counts are the observed
  frequency across 92 datasets. Nothing here is inferred from upstream CKAN
  documentation; fields CKAN does not ship (the dataclassification / rights /
  identifier / ib1_* block) are NGED's own extensions and are the interesting
  part.
dataset_fields:
- term: dataclassification
  origin: NGED extension (Ofgem Data Best Practice data triage)
  type: enum
  values:
  - {value: Shared, count: 52, meaning: openly licensed but payload access restricted to registered users}
  - {value: Open, count: 38, meaning: openly licensed; most payloads downloadable anonymously}
  - {value: Closed, count: 2, meaning: not published — only the Data Sharing Assessment PDF is available}
  caveat: >-
    "Open" is a LICENSING classification, not an access one. 1,120 resources on
    Open-classified datasets are still URL-redacted to anonymous callers.
- term: rights
  origin: NGED extension
  type: enum
  values:
  - {value: WPD Shared Data Licence, count: 49}
  - {value: WPD Open Data Licence, count: 43}
  note: >-
    The WPD prefix is the Western Power Distribution lineage the portal was built
    on. Both licences resolve to https://www.nationalgrid.co.uk/open-data-licence.
    This field — not the standard CKAN license_id — is the authoritative licence
    signal: only 19 of 92 datasets populate license_id at all.
- term: updatefrequency
  origin: NGED extension
  type: enum
  values:
  - {value: Not Applicable, count: 38}
  - {value: 12 Months, count: 27}
  - {value: Near Real Time, count: 15}
  - {value: 1 Month, count: 12}
- term: identifier
  origin: NGED extension
  type: short code
  examples: [FNGEDGEO, PCD, LTDS-Capacity-Heatmap, EMIDPRILIVE, WMIDPRILIVE, SWALESPRILIVE, flexibility-primary]
  note: >-
    NGED's internal dataset code. FNGEDGEO covers the 20-dataset geospatial
    family; the *PRILIVE codes are the live primary substation feeds for East
    Midlands, West Midlands and South Wales; PCD is Power Cut Data.
