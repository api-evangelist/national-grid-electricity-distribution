apis:
- aid: national-grid-electricity-distribution:nged-connected-data-api
  name: NGED Connected Data Portal API
  description: >-
    The public CKAN 2.9.8 Action API behind National Grid Electricity
    Distribution's Connected Data Portal, documented by NGED on its own API
    Guidance page. Exposes the DNO's open data catalogue — 91 datasets, 8,687
    resources, 155 tags and 6 data groups (connection, demand, flexibility,
    innovation, system-and-network, system-planning) — covering live power cuts,
    live primary and secondary substation measurements, LV load monitoring, the
    Embedded Capacity Register, the generation capacity register, distribution
    substation data and the Ofgem-mandated aggregated smart meter consumption
    data. Catalogue-level calls (package_list, package_search, package_show,
    group_list, group_show, tag_list, status_show) return 200 anonymously.
    Resource-level calls (resource_show, datastore_search) and the majority of
    resource download URLs are gated behind a free API token, returning
    "Access denied: Resource access restricted to registered users".
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://connecteddata.nationalgrid.co.uk/api-guidance
  baseURL: https://connecteddata.nationalgrid.co.uk/api/3/action/
