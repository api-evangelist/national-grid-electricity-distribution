url: https://raw.githubusercontent.com/api-evangelist/national-grid-electricity-distribution/refs/heads/main/apis.yml
name: National Grid Electricity Distribution
kind: company
description: >-
  National Grid Electricity Distribution (NGED) is the licensed electricity
  distribution network operator for the Midlands, the South West of England and
  South Wales — the poles-and-wires DNO that delivers power to over 7.9 million
  customers across roughly 55,500 square kilometres, formed when National Grid
  acquired Western Power Distribution in 2021. It sits between the transmission
  network and the retail suppliers, owning the physical network, the connection
  queue and the low-voltage measurement estate, while selling nothing to
  consumers directly. Its home market is the United Kingdom, where there is no
  consumer data-portability mandate equivalent to Australia's Consumer Data
  Right: individual household smart-meter data flows through the licensed Smart
  DCC monopoly and the energy suppliers, not through the distributor. What Britain
  mandated instead lands squarely on NGED — Ofgem's Data Best Practice Guidance is
  a licence condition on every DNO, and NGED has actually implemented it. The
  Connected Data Portal at connecteddata.nationalgrid.co.uk is a live CKAN 2.9.8
  instance carrying 91 datasets and 8,687 resources under a genuine open licence
  derived from the Open Government Licence v3.0, with a documented public CKAN
  Action API, published API-token guidance, and DCAT catalogue exports in
  JSON-LD, Turtle, N3 and RDF/XML. The posture is therefore the inverse of most
  utilities in this study: open, documented and machine-readable on grid and
  market data — including the Ofgem-mandated aggregated smart-meter consumption
  data at LV feeder and secondary substation level — and completely absent on
  individual consumer data, which the distributor is neither obliged nor equipped
  to expose. Anonymous callers get the full catalogue and 774 resource payloads;
  the other 7,913 are redacted behind a free, self-serve, email-verified account.
