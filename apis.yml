- aid: national-grid-electricity-distribution:nged-connected-data-catalogue
  name: NGED Connected Data DCAT Catalogue
  description: >-
    Machine-readable DCAT catalogue exports of the entire NGED Connected Data
    Portal, linked from the footer of every portal page and served anonymously in
    four serialisations — JSON-LD (205 KB), Turtle (112 KB), N3 and RDF/XML. Not
    a REST API but a genuine, versionless, contract-shaped harvesting surface for
    the DNO's full 91-dataset catalogue.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
